name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    # Package.swift needs the Swift 6.2 toolchain (Xcode 26).
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: swift build -c release
      - run: swift test
